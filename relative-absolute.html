<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 600px;
            margin: 200px auto;
            color: #fff;
            position: relative;
        }
        img{
            width: 100%;
            border-radius: 20px;
        }
        .content{
            position: absolute;
            top: 50%;
            padding: 0 20px;
            text-align: center;
        }
        .tint{
            position: absolute;
            background-color: rgba(0, 0, 0, 0.611);
            top: 0;
            bottom: 4px;
            left: 0;
            right: 0;
            border-radius: 20px;
        }
        button{
            color: black;
            padding: 12px 20px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://a.cdn-hotels.com/gdcs/production143/d1112/c4fedab1-4041-4db5-9245-97439472cf2c.jpg" alt="">
        <div class="tint"></div>
        <div class="content">
            <h1>Explore the Diversities Of Bali</h1>
            <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Ex magnam amet, inventore eveniet facilis eius provident.</p>
            <button>Explore now</button>
        </div>
    </div>
</body>
</html>
