<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .cards-section {
            overflow: hidden;
        }

        .dribble-cards {
            margin-top: 90px;
            display: flex;
            gap: 40px;
            animation-name: card-animation;
            animation-duration: 30s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
        }

        @keyframes card-animation {
            0% {}

            100% {
                transform: translate(-100%);

            }
        }

        .dribble-cards::-webkit-scrollbar {
            display: none;
        }

        .card {
            width: 270px;
            height: 320px;
            background-color: blueviolet;
            border-radius: 26px;
            flex-shrink: 0;
            overflow: hidden;
            position: relative;
        }

        .user {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .tint {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            background: -webkit-gradient(linear, left top, left bottom, color-stop(51.91%, transparent), color-stop(75.88%, rgba(0, 0, 0, 0.3)));
            background: linear-gradient(180deg, transparent 51.91%, rgba(0, 0, 0, 0.3) 75.88%);
        }
    </style>
</head>

<body>
    <div class="cards-section">
        <div class="dribble-cards">
            <div class="card">
                <img src="https://cdn.dribbble.com/uploads/47176/original/9b22cd83bde1809976bec0722d1f8923.jpeg" alt=""
                    class="user">
                <div class="tint"></div>
            </div>

            <div class="card">
                <img src="https://cdn.dribbble.com/uploads/47171/original/daniele-buffa-3.png" class="user" alt="">
                <div class="tint"></div>
            </div>

            <div class="card">
                <video class="user" autoplay muted loop
                    src="https://cdn.dribbble.com/uploads/47181/original/1e3a73a174484bef522b620c401cd00a.mp4"></video>
                <div class="tint"></div>
            </div>

            <div class="card">
                <img src="https://cdn.dribbble.com/uploads/47175/original/1fb34610061a95a007ac5e7b1dc53138.jpeg"
                    class="user" alt="">
                <div class="tint"></div>
            </div>

            <div class="card">
                <img class="user" src="https://cdn.dribbble.com/uploads/47173/original/Vladimir_Gruev.png" class="user"
                    alt="">
                <div class="tint"></div>
            </div>

            <div class="card">
                <video class="user" autoplay muted loop
                    src="https://cdn.dribbble.com/uploads/47180/original/1def7b9fb30832c4af4353b325d9c3af.mp4"></video>
                <div class="tint"></div>
            </div>

            <div class="card">
                <img src="https://cdn.dribbble.com/uploads/47171/original/daniele-buffa-3.png" class="user" alt="">
                <div class="tint"></div>
            </div>

            <div class="card">
                <video class="user" autoplay muted loop
                    src="https://cdn.dribbble.com/uploads/47179/original/35d07cfebd303e05e688078015da0cc2.mp4"></video>
                <div class="tint"></div>
            </div>


        </div>
    </div>
</body>

</html>
