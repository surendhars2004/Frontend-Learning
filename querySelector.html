<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            padding: 0;
        }
        .container{
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .btn{
            padding: 16px 30px;
            border-radius: 14px;
            color: white;
            background-color: black;
            border: 2px solid white;
            font-size: 16px;
            transition: .5s;
            margin: 5px;
        }
        .btn:hover{
            background-color: white;
            color: black;
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <div class="container">
        <button id="btn" class="btn" data-name="Ashish" data-age="30">Hey Ashish !</button>
        <button id="btn" class="btn" data-name="Sureyy" data-age="21">Hey Sureyy !</button>
        <button id="btn" class="btn" data-name="Shukla" data-age="45">Hey Shukla !</button>
        <button id="btn" class="btn" data-name="Bharani" data-age="28">Hey Bharani !</button>
        <button id="btn" class="btn" data-name="Barghav" data-age="33">Hey Barghav !</button>
    </div>


    <script>
        let btns = document.querySelectorAll('.btn')
        btns.forEach( (btn) => {
            btn.addEventListener('click' ,(event) => {
                console.log("Name : ",event.target.dataset.name, "  Age : ", event.target.dataset.age);
        })
        });
        
    </script>
</body>
</html>
