    <script>
        

        // example 2

        //example 3
        fetch('https://jsonplaceholder.typicode.com/todos/1')

        // example 1
        function respone(){
            console.log("D : you will be alright , take the medicine")
        }
        function reply(response){
            console.log("D : Hello Trisha i'm the doctor, how can i help you")
            setTimeout(response,1000)
        }
        function greet(reply,respone){
            console.log("u: Hello Trisha")
            setTimeout(reply,1000,respone)
        }
        greet(reply,respone)

        //chaining call back
        function first(callback){
            setTimeout(()=>{
                console.log("first running...")
                callback()
            },3000)
           
        }
        function second(callback){
            setTimeout(()=>{
                console.log("second running...")
                callback()
            },3000)
           
        }
        function third(){
            setTimeout(()=>{
                console.log("third running...")
            },3000)
        }

        first(() => second( () => third() ))
    </script>
